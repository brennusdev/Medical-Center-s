# MED V13 — Configuração central do pytest.
#
# DECISÕES:
# - testpaths: só `tests/` (não varrer alembic/`App` buscando teste).
# - strict-markers: marcador digitado errado falha em vez de passar silencioso.
# - warningfilter: StarletteDeprecationWarning (HTTP_422...) vem da lib, não
#   do nosso código — filtrada por enquanto; remover quando starlette atualizar.
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    integration: testes que exercitam múltiplas camadas (router→service→repo)
    security: testes de segurança/auth/auditoria
filterwarnings =
    ignore::DeprecationWarning:starlette.*
